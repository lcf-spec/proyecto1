[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geotools"
version = "0.1.0"
description = "Core geotechnical engineering calculations (Geotecnia II)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas"]

[tool.setuptools]
packages = ["geotools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
